name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dist:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.28

      - name: Build sdist and wheel
        run: |
          uv build

      - name: Check metadata
        run: |
          uvx twine check --strict dist/*

      - name: Check distribution contents
        run: |
          uv run --no-project python check_dist.py dist

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
