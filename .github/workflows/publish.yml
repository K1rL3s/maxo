name: Publish

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # обязателен для Trusted Publishing
      contents: write  # для заливки артефактов в GitHub Release
    steps:
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          sdist="$(basename dist/maxo-*.tar.gz)"
          ver="${sdist#maxo-}"
          ver="${ver%.tar.gz}"
          test "$tag" = "$ver" || {
            echo "Тег $tag != версия пакета $ver"; exit 1;
          }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

      - name: Attach distribution to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
