name: Lint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.28
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run ruff
        run: |
          uv run ruff check --no-fix .

      - name: Run black
        run: |
          uv run black --check .

      - name: Run mypy
        run: |
          uv run mypy --config-file pyproject.toml

      - name: Run codespell
        run: |
          uv run codespell src examples

      - name: Run slotscheck
        run: |
          PYTHONPATH=src uv run slotscheck -m maxo

      - name: Run bandit
        run: |
          uv run bandit -c pyproject.toml src -r
