name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.python-version }} ${{ matrix.dependency-resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
        dependency-resolution: [ "lowest-direct", "highest" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: 0.11.28
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.dependency-resolution }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install dependencies with ${{ matrix.dependency-resolution }} resolution
        run: |
          uv sync --all-groups --resolution ${{ matrix.dependency-resolution }}

      - name: Run tests with coverage
        id: pytest
        run: |
          just test --cov-report=xml

      - name: Run butcher tests
        run: |
          just butcher-test

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.dependency-resolution }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
