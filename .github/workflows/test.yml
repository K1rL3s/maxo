name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: "true"

jobs:
  tests:
    name: ${{ matrix.python-version }} ${{ matrix.dependency-resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
        dependency-resolution: [ "lowest-direct", "highest" ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.23

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install dependencies with ${{ matrix.dependency-resolution }} resolution
        run: |
          uv sync --all-groups --resolution ${{ matrix.dependency-resolution }}

      - name: Run tests with coverage
        id: pytest
        run: |
          just test --cov-report=xml

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.dependency-resolution }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
