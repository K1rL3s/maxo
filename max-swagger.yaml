          description: List of updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    access_token:
      type: apiKey
      name: Authorization
      description: |-
        A token is given to you on https://business.max.ru/ after you have created a bot.
        In all subsequent requests to the Bot API, you **must** pass the received token as an Authorization header in the HTTPS request. 
      in: header
  responses:
    SuccessResponse:
      description: Success or not result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleQueryResult'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authorization Error. No `access_token` provided or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access error. You don't have permissions to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource is not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAllowed:
      description: Method is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    bigint:
      description: 64-bit integer identifier
      type: integer
      format: int64
    UserId:
      description: User identifier
      type: integer
      format: int64
    ChatId:
      description: Chat identifier
      type: integer
      format: int64
    MessageId:
      description: Message identifier
      type: string
      minLength: 1
    Url:
      description: URL string
      type: string
    SubscriptionUrl:
      type: string
      description: URL of HTTPS-endpoint of your bot. Must starts with https://
    User:
      type: object
      description: User object
      properties:
        user_id:
          description: Users identifier
          allOf:
            - $ref: '#/components/schemas/UserId'
        first_name:
          description: Users first name
          type: string
        last_name:
          description: Users last name
          type: string
          nullable: true
          readOnly: false
        username:
          description: Unique public user name. Can be `null` if user is not accessible or it is not set
          type: string
          nullable: true
          readOnly: false
        is_bot:
          description: '`true` if user is bot'
          type: boolean
        last_activity_time:
          description: Time of last user activity in Max (Unix timestamp in milliseconds). Can be outdated if user disabled its "online" status in settings
          type: integer
          format: int64
          nullable: true
          readOnly: false
      required:
        - user_id
        - first_name
        - is_bot
    UserWithPhoto:
      type: object
      description: User with description and avatar URLs
      allOf:
        - $ref: '#/components/schemas/User'
        - properties:
            description:
              description: User description. Can be `null` if user did not fill it out
              maxLength: 16000
              type: string
              nullable: true
              readOnly: false
            avatar_url:
              description: URL of avatar
              type: string
              readOnly: false
              nullable: true
            full_avatar_url:
              description: URL of avatar of a bigger size
              type: string
              readOnly: false
              nullable: true
    BotInfo:
      type: object
      description: Bot information with commands and official status
      allOf:
        - $ref: '#/components/schemas/UserWithPhoto'
        - properties:
            commands:
              description: Commands supported by bot
              type: array
              items:
                $ref: '#/components/schemas/BotCommand'
              maxItems: 32
              readOnly: false
              nullable: true
    BotCommandsInfo:
      type: object
      description: Bot commands information
      properties:
        commands:
          description: Commands supported by bot
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          maxItems: 32
          readOnly: false
          nullable: true
    BotCommandsPatch:
      type: object
      description: Patch object for updating bot commands
      properties:
        commands:
          description: Commands supported by bot
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          maxItems: 32
          readOnly: false
    BotCommand:
      type: object
      description: Bot command with name and description
      properties:
        name:
          description: Command name
          type: string
          maxLength: 64
          minLength: 1
        description:
          description: Optional command description
          type: string
          minLength: 1
          maxLength: 128
          readOnly: false
          nullable: true
      required:
        - name
    Chat:
      type: object
      description: Chat, channel or dialog object 
      properties:
        chat_id:
          description: Chats identifier
          allOf:
            - $ref: '#/components/schemas/ChatId'
        type:
          description: 'Type of chat. One of: dialog, chat, channel'
          allOf:
            - $ref: '#/components/schemas/ChatType'
        status:
          description: |-
            Chat status. One of:
             - active: bot is active member of chat
             - removed: bot was kicked
             - left: bot intentionally left chat
             - closed: chat was closed
             - suspended: bot was stopped by user. *Only for dialogs*
          allOf:
            - $ref: '#/components/schemas/ChatStatus'
        title:
          description: Visible title of chat. Can be null for dialogs
          type: string
          nullable: true
          readOnly: false
        icon:
          description: Icon of chat
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Image'
          readOnly: false
        last_event_time:
          description: Time of last event occurred in chat
          type: integer
          format: int64
        participants_count:
          description: Number of people in chat. Always 2 for `dialog` chat type
          type: integer
          format: int32
        owner_id:
          description: Identifier of chat owner. Visible only for chat admins
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserId'
          readOnly: false
        participants:
          description: Participants in chat with time of last activity. Can be *null* when you request list of chats. Visible for chat admins only
          nullable: true
          readOnly: false
          type: object
          additionalProperties:
            type: integer
            format: int64
        is_public:
          description: Is current chat publicly available. Always `false` for dialogs
          type: boolean
        link:
          description: Link on chat
          type: string
          readOnly: false
          nullable: true
        description:
          description: Chat description
          type: string
          nullable: true
          readOnly: false
        dialog_with_user:
          description: Another user in conversation. For `dialog` type chats only
          allOf:
            - $ref: '#/components/schemas/UserWithPhoto'
          nullable: true
          readOnly: false
        messages_count:
          description: Messages count in chat. Only for group chats and channels. **Not available** for dialogs
          nullable: true
          readOnly: false
          type: integer
        pinned_message:
          description: Pinned message in chat or channel. Returned only when single chat is requested
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/Message'
      required:
        - chat_id
        - type
        - status
        - last_event_time
        - participants_count
        - is_public
    ChatType:
      type: string
      description: Type of chat. Dialog (one-on-one), chat or channel
      enum:
        - dialog
        - chat
        - channel
    ChatStatus:
      type: string
      description: Chat status for current bot
      enum:
        - active
        - removed
        - left
        - closed
        - suspended
    ChatList:
      type: object
      description: Paginated list of chats
      properties:
        chats:
          description: List of requested chats
          type: array
          items:
            $ref: '#/components/schemas/Chat'
        marker:
          description: Reference to the next page of requested chats
          nullable: true
          type: integer
          format: int64
          readOnly: false
      required:
        - chats
    ChatPatch:
      type: object
      description: Patch object for updating chat info
      properties:
        icon:
          readOnly: false
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
        title:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: false
          nullable: true
        description:
          description: Chat description up to 16k characters long. Pass empty string to remove description
          type: string
          maxLength: 16000
          readOnly: false
          nullable: true
        pin: 
          description: Identifier of message to be pinned in chat. In case you want to remove pin, use /unpin method
          type: string
          readOnly: false
          nullable: true
        notify:
          description: By default, participants will be notified about change with system message in chat/channel
          type: boolean
          default: true
          readOnly: false
          nullable: true
    ChatMember:
      type: object
      description: Chat or channel member with membership info 
      allOf:
        - $ref: '#/components/schemas/UserWithPhoto'
        - properties:
            last_access_time:
              description: User last activity time in chat or channel . Can be outdated for super chats and channels (equals to `join_time`)
              type: integer
              format: int64
            is_owner:
              type: boolean
            is_admin:
              type: boolean
            join_time:
              type: integer
              format: int64
            permissions:
              description: Permissions in chat if member is admin. `null` otherwise
              type: array
              uniqueItems: true
              nullable: true
              items:
                $ref: '#/components/schemas/ChatAdminPermission'
              readOnly: false
            alias:
              description: Alias in chat if member is admin. By default, `null`
              type: string
              nullable: true
              readOnly: false
          required:
            - last_access_time
            - is_owner
            - is_admin
            - join_time
    ChatAdminPermission:
      description: Chat admin permissions
      type: string
      enum:
        - read_all_messages
        - add_remove_members
        - add_admins
        - change_chat_info
        - pin_message
        - edit_link
        - write
        - edit
        - delete
        - can_call
        - view_stats
    ChatMembersList:
      type: object
      description: Paginated list of chat members
      properties:
        members:
          description: Participants in chat with time of last activity
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
        marker:
          description: Pointer to the next data page
          type: integer
          format: int64
          nullable: true
          readOnly: false
      required:
        - members
    Image:
      type: object
      description: Generic schema describing image object
      properties:
        url:
          description: URL of image
          type: string
      required:
        - url
    Subscription:
      type: object
      description: Schema to describe WebHook subscription
      properties:
        url:
          description: Webhook URL
          type: string
        time:
          description: Unix-time when subscription was created
          type: integer
          format: int64
        update_types:
          description: Update types bot subscribed for
          example: '["message_created", "bot_started"]'
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
            minLength: 1
          readOnly: false
      required:
        - url
        - time
    Recipient:
      type: object
      description: New message recipient. Could be user, chat or channel 
      properties:
        chat_id:
          description: Chat or channel identifier
          allOf:
            - $ref: '#/components/schemas/ChatId'
          nullable: true
          readOnly: false
        chat_type:
          description: Chat type
          allOf:
            - $ref: '#/components/schemas/ChatType'
        user_id:
          description: User identifier, if message was sent to user
          allOf:
            - $ref: '#/components/schemas/UserId'
          nullable: true
          readOnly: false
        post_id:
          description: Post identifier for comments
          allOf:
            - $ref: '#/components/schemas/MessageId'
          nullable: true
          readOnly: false
      required:
        - chat_type
    Message:
      type: object
      description: Message in chat
      properties:
        sender:
          description: User who sent this message. Can be `null` if message has been posted on behalf of a channel
          allOf:
            - $ref: '#/components/schemas/User'
          readOnly: false
          nullable: true
        recipient:
          description: Message recipient. Could be user, chat or channel  
          allOf:
            - $ref: '#/components/schemas/Recipient'
        timestamp:
          description: Unix-time when message was created
          type: integer
          format: int64
        link:
          description: Forwarded or replied message
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/LinkedMessage'
        body:
          description: Body of created message. Text + attachments. Could be null if message contains only forwarded message
          allOf:
            - $ref: '#/components/schemas/MessageBody'
        stat:
          description: 'Message statistics. Available only for channels in getMessages method context'
          allOf:
            - $ref: '#/components/schemas/MessageStat'
          nullable: true
          readOnly: false
        url:
          description: Message public URL. Can be `null` for dialogs or non-public chats/channels
          type: string
          nullable: true
          readOnly: false
      required:
        - recipient
        - body
        - timestamp
    CommentMessage:
      type: object
      description: Comment message in chat. Unlike Message, has no public url and body has no attachments.
      properties:
        sender:
          description: User who sent this comment. Can be `null` if message has been posted on behalf of a channel
          allOf:
            - $ref: '#/components/schemas/User'
          readOnly: false
          nullable: true
        recipient:
          description: Message recipient. Could be user or chat, for comments - only channel
          allOf:
            - $ref: '#/components/schemas/Recipient'
        timestamp:
          description: Unix-time when message was created
          type: integer
          format: int64
        link:
          description: Forwarded or replied message
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/CommentLinkedMessage'
        body:
          description: Body of created comment. Text only, no attachments.
          allOf:
            - $ref: '#/components/schemas/CommentMessageBody'
        stat:
          description: 'Message statistics. Available only for channels in in getMessages method context'
          allOf:
            - $ref: '#/components/schemas/MessageStat'
          nullable: true
          readOnly: false
      required:
        - recipient
        - body
        - timestamp
    MessageStat:
      type: object
      description: Message statistics
      properties:
        views:
          type: integer
      required:
        - views
    MessageBody:
      description: Schema representing body of message
      type: object
      properties:
        mid:
          description: Unique identifier of message
          allOf:
            - $ref: '#/components/schemas/MessageId'
        seq:
          description: Sequence identifier of message in chat
          type: integer
          format: int64
        text:
          description: Message text
          type: string
          nullable: true
          readOnly: false
        attachments:
          description: Message attachments. Could be one of `Attachment` type. See description of this schema
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: false
        markup:
          description: Message text markup. See formatting section in https://dev.max.ru/docs-api for more info
          type: array
          nullable: true
          readOnly: false
          items:
            $ref: '#/components/schemas/MarkupElement'
      required:
        - mid
        - seq
    CommentMessageBody:
      description: Schema representing body of a comment message. Unlike MessageBody, attachments are not allowed.
      type: object
      properties:
        mid:
          description: Unique identifier of message
          allOf:
            - $ref: '#/components/schemas/MessageId'
        seq:
          description: Sequence identifier of message in chat
          type: integer
          format: int64
        text:
          description: Message text
          type: string
          nullable: true
          readOnly: false
        markup:
          description: Message text markup. See Formatting section in https://dev.max.ru/docs-api for more info
          type: array
          nullable: true
          readOnly: false
          items:
            $ref: '#/components/schemas/MarkupElement'
      required:
        - mid
        - seq
    MessageList:
      type: object
      description: Paginated list of messages
      properties:
        messages:
          description: List of messages
          type: array
          items:
            $ref: '#/components/schemas/Message'
      required:
        - messages
    CommentMessageList:
      type: object
      description: Paginated list of comment messages
      properties:
        messages:
          description: List of comment messages
          type: array
          items:
            $ref: '#/components/schemas/CommentMessage'
      required:
        - messages
    TextFormat:
      description: Message text format
      type: string
      enum:
        - markdown
        - html
    NewMessageBody:
      type: object
      description: Body of a new message to send
      properties:
        text:
          description: Message text
          type: string
          maxLength: 4000
          nullable: true
          readOnly: false
        attachments:
          description: Message attachments. See `AttachmentRequest` and it's inheritors for full information
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AttachmentRequest'
          readOnly: false
        link:
          description: Link to Message
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NewMessageLink'
          readOnly: false
        notify:
          description: If false, chat participants would not be notified
          type: boolean
          default: true
          readOnly: false
        format:
          description: If set, message text will be formatted according to given markup
          readOnly: false
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TextFormat'
    NewCommentBody:
      type: object
      description: Body of a new comment to send. Unlike NewMessageBody, attachments are not allowed.
      properties:
        text:
          description: Message text
          type: string
          maxLength: 4000
          nullable: true
          readOnly: false
        link:
          description: Link to Message
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NewMessageLink'
          readOnly: false
        format:
          description: If set, message text will be formatted according to given markup
          readOnly: false
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TextFormat'
    NewMessageLink:
      type: object
      description: Link to a message for reply or forward
      properties:
        type:
          description: Type of message link
          nullable: false
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
        mid:
          description: Message identifier of original message
          allOf:
            - $ref: '#/components/schemas/MessageId'
          nullable: false
      required:
        - type
        - mid
    LinkedMessage:
      type: object
      description: Forwarded or replied message
      properties:
        type:
          description: Type of linked message
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
        sender:
          description: User sent this message. Can be `null` if message has been posted on behalf of a channel
          allOf:
            - $ref: '#/components/schemas/User'
          readOnly: false
          nullable: true
        chat_id:
          description: Chat where message has been originally posted
          allOf:
            - $ref: '#/components/schemas/ChatId'
          readOnly: false
        message:
          allOf:
            - $ref: '#/components/schemas/MessageBody'
      required:
        - type
        - message
    CommentLinkedMessage:
      type: object
      description: Forwarded or replied comment. Unlike LinkedMessage, `message` is a CommentMessageBody (no attachments, as comments cannot have them)
      properties:
        type:
          description: Type of linked message
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
        sender:
          description: User sent this message. Can be `null` if message has been posted on behalf of a channel
          allOf:
            - $ref: '#/components/schemas/User'
          readOnly: false
          nullable: true
        chat_id:
          description: Chat where message has been originally posted
          allOf:
            - $ref: '#/components/schemas/ChatId'
          readOnly: false
        message:
          allOf:
            - $ref: '#/components/schemas/CommentMessageBody'
      required:
        - type
        - message
    SendMessageResult:
      type: object
      description: Result of sending a message
      properties:
        message:
          $ref: '#/components/schemas/Message'
      required:
        - message
    SendCommentResult:
      type: object
      description: Result of sending a comment
      properties:
        message:
          $ref: '#/components/schemas/CommentMessage'
      required:
        - message
    Attachment:
      type: object
      description: Generic schema representing message attachment
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachment'
          video: '#/components/schemas/VideoAttachment'
          audio: '#/components/schemas/AudioAttachment'
          file: '#/components/schemas/FileAttachment'
          sticker: '#/components/schemas/StickerAttachment'
          contact: '#/components/schemas/ContactAttachment'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachment'
          share: '#/components/schemas/ShareAttachment'
          location: '#/components/schemas/LocationAttachment'
      properties:
        type:
          type: string
      required:
        - type
    PhotoAttachment:
      type: object
      description: Image attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/PhotoAttachmentPayload'
          required:
            - payload
    PhotoAttachmentPayload:
      type: object
      description: Payload of photo attachment containing image metadata
      properties:
        photo_id:
          description: Unique identifier of this image
          type: integer
          format: int64
        token:
          description: ''
          type: string
        url:
          description: Image URL
          type: string
      required:
        - photo_id
        - url
        - token
    VideoAttachment:
      type: object
      description: Video attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/MediaAttachmentPayload'
            thumbnail:
              description: Video thumbnail
              nullable: true
              readOnly: false
              allOf:
                - $ref: '#/components/schemas/VideoThumbnail'
            width:
              description: Video width
              type: integer
              nullable: true
              readOnly: false
            height:
              description: Video height
              type: integer
              nullable: true
              readOnly: false
            duration:
              description: Video duration in seconds
              type: integer
              nullable: true
              readOnly: false
          required:
            - payload
    VideoThumbnail:
      type: object
      description: Video thumbnail image
      properties:
        url:
          description: Image URL
          type: string
      required:
        - url
    VideoUrls:
      type: object
      description: Available video download and streaming URLs by resolution
      properties:
        mp4_1080:
          description: Video URL in 1080p resolution, if available
          type: string
          nullable: true
          readOnly: false
        mp4_720:
          description: Video URL in 720 resolution, if available
          type: string
          nullable: true
          readOnly: false
        mp4_480:
          description: Video URL in 480 resolution, if available
          type: string
          nullable: true
          readOnly: false
        mp4_360:
          description: Video URL in 360 resolution, if available
          type: string
          nullable: true
          readOnly: false
        mp4_240:
          description: Video URL in 240 resolution, if available
          type: string
          nullable: true
          readOnly: false
        mp4_144:
          description: Video URL in 144 resolution, if available
          type: string
          nullable: true
          readOnly: false
        hls:
          description: Live streaming URL, if available
          type: string
          nullable: true
          readOnly: false
    VideoAttachmentDetails:
      type: object
      description: Detailed information about video attachment including direct URLs
      properties:
        token:
          description: Video attachment token
          type: string
        urls:
          description: URLs to download or play video. Can be null if video is unavailable
          nullable: true
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/VideoUrls"
        thumbnail:
          description: Video thumbnail
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentPayload'
        width:
          description: Video width
          type: integer
        height:
          description: Video height
          type: integer
        duration:
          description: Video duration in seconds
          type: integer
      required:
        - width
        - height
        - duration
        - token
    AudioAttachment:
      type: object
      description: Audio attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/MediaAttachmentPayload'
            transcription:
              description: Audio transcription
              type: string
              nullable: true
              readOnly: false
          required:
            - payload
    FileAttachment:
      type: object
      description: File attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/FileAttachmentPayload'
            filename:
              description: Uploaded file name
              type: string
            size:
              description: File size in bytes
              type: integer
              format: int64
          required:
            - payload
            - filename
            - size
    AttachmentPayload:
      type: object
      description: Base payload for message attachments containing media URL
      properties:
        url:
          description: |-
            Media attachment URL.
            For video attachments use getVideoAttachmentDetails method to obtain direct links.
          type: string
      required:
        - url
    MediaAttachmentPayload:
      type: object
      description: Payload for media (video/audio) attachments with reuse token
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
        - properties:
            token:
              description: Use `token` in case when you are trying to reuse the same attachment in other message
              type: string
          required:
            - token
    FileAttachmentPayload:
      type: object
      description: Payload for file attachments with reuse token
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
        - properties:
            token:
              description: Use `token` in case when you are trying to reuse the same attachment in other message
              type: string
          required:
            - token
    ContactAttachment:
      type: object
      description: Contact attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/ContactAttachmentPayload'
          required:
            - payload
    ContactAttachmentPayload:
      type: object
      description: Payload of contact attachment containing user contact info
      properties:
        vcf_info:
          description: User info in VCF format
          nullable: true
          readOnly: false
          type: string
        hash:
          description: User info in VCF format hash
          nullable: true
          readOnly: false
          type: string
        max_info:
          description: User info
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/User'
    StickerAttachmentPayload:
      type: object
      description: Payload of sticker attachment
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
        - properties:
            code:
              description: Sticker identifier
              type: string
          required:
            - code
    StickerAttachment:
      type: object
      description: Sticker attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/StickerAttachmentPayload'
            width:
              description: Sticker width
              type: integer
            height:
              description: Sticker height
              type: integer
          required:
            - payload
            - width
            - height
    ShareAttachmentPayload:
      type: object
      description: Payload of ShareAttachmentRequest
      properties:
        url:
          description: URL attached to message as media preview
          minLength: 1
          type: string
          nullable: true
          readOnly: false
        token:
          description: Attachment token
          type: string
          nullable: true
          readOnly: false
    ShareAttachment:
      type: object
      description: Link preview attachment with media
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/ShareAttachmentPayload'
            title:
              description: Link preview title
              type: string
              readOnly: false
              nullable: true
            description:
              description: Link preview description
              type: string
              readOnly: false
              nullable: true
            image_url:
              description: Link preview image
              type: string
              nullable: true
              readOnly: false
          required:
            - payload
    LocationAttachment:
      type: object
      description: Geographic location attachment
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
          required:
            - latitude
            - longitude
    InlineKeyboardAttachment:
      type: object
      description: Buttons in messages
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - properties:
            payload:
              $ref: '#/components/schemas/Keyboard'
          required:
            - payload
    Keyboard:
      type: object
      description: Keyboard is two-dimension array of buttons
      properties:
        buttons:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Button'
      required:
        - buttons
    Button:
      type: object
      description: Inline keyboard button
      properties:
        type:
          type: string
        text:
          description: Visible text of button
          type: string
          minLength: 1
          maxLength: 128
      discriminator:
        propertyName: type
        mapping:
          callback: '#/components/schemas/CallbackButton'
          link: '#/components/schemas/LinkButton'
          request_geo_location: '#/components/schemas/RequestGeoLocationButton'
          request_contact: '#/components/schemas/RequestContactButton'
          message: '#/components/schemas/MessageButton'
          open_app: '#/components/schemas/OpenAppButton'
          clipboard: '#/components/schemas/ClipboardButton'
      required:
        - type
        - text
    CallbackButton:
      type: object
      description: After pressing this type of button client sends to server payload it contains
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            payload:
              description: Button payload
              type: string
              maxLength: 1024
          required:
            - payload
    LinkButton:
      type: object
      description: After pressing this type of button user follows the link it contains
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            url:
              type: string
              maxLength: 2048
          required:
            - url
    MessageButton:
      type: object
      description: After pressing this type of button it sends message from user in chat
      allOf:
        - $ref: '#/components/schemas/Button'
    RequestContactButton:
      type: object
      description: After pressing this type of button client sends new message with attachment of current user contact
      allOf:
        - $ref: '#/components/schemas/Button'
    RequestGeoLocationButton:
      type: object
      description: After pressing this type of button client sends new message with attachment of current user geo location
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            quick:
              description: If *true*, sends location without asking user's confirmation
              readOnly: false
              type: boolean
              default: false
    OpenAppButton:
      type: object
      description: After pressing this type of button client opens mini app
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            payload:
              description: Button payload
              nullable: true
              readOnly: false
              type: string
              pattern: '^[\w-]*$'
              maxLength: 512
            web_app:
              description: Unique public name of the bot wired to the mini app
              type: string
            contact_id:
              description: Unique identifier of the bot wired to the mini app
              nullable: true
              readOnly: false
              allOf:
                - $ref: '#/components/schemas/UserId'
          required:
            - web_app
    ClipboardButton:
      type: object
      description: After pressing this type of button client copies payload data to clipboard
      allOf:
        - $ref: '#/components/schemas/Button'
        - properties:
            payload:
              description: Button payload
              type: string
              maxLength: 1024
          required:
            - payload
    MessageLinkType:
      description: Type of linked message
      type: string
      enum:
        - forward
        - reply
    AttachmentRequest:
      type: object
      description: Request to attach some data to message
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachmentRequest'
          video: '#/components/schemas/VideoAttachmentRequest'
          audio: '#/components/schemas/AudioAttachmentRequest'
          file: '#/components/schemas/FileAttachmentRequest'
          sticker: '#/components/schemas/StickerAttachmentRequest'
          contact: '#/components/schemas/ContactAttachmentRequest'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachmentRequest'
          location: '#/components/schemas/LocationAttachmentRequest'
          share: '#/components/schemas/ShareAttachmentRequest'
      properties:
        type:
          type: string
      required:
        - type
    PhotoAttachmentRequest:
      type: object
      description: Request to attach image to message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
          required:
            - payload
    PhotoAttachmentRequestPayload:
      type: object
      description: Request to attach image. All fields are mutually exclusive
      properties:
        url:
          description: Any external image URL you want to attach
          minLength: 1
          nullable: true
          readOnly: false
          type: string
        token:
          description: Token of any existing attachment
          nullable: true
          readOnly: false
          type: string
        photos:
          description: Tokens were obtained after uploading images
          nullable: true
          readOnly: false
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PhotoToken'
    PhotoToken:
      type: object
      description: Token representing an uploaded image
      properties:
        token:
          description: Encoded information of uploaded image
          type: string
      required:
        - token
    VideoAttachmentRequest:
      type: object
      description: Request to attach video to message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/UploadedInfo'
          required:
            - payload
    AudioAttachmentRequest:
      type: object
      description: Request to attach audio to message. MUST be the only attachment in message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/UploadedInfo'
          required:
            - payload
    UploadedInfo:
      type: object
      description: This is information you will receive as soon as audio/video is uploaded
      properties:
        token:
          description: Token is unique uploaded media identifier
          type: string
          readOnly: false
    FileAttachmentRequest:
      type: object
      description: Request to attach file to message. MUST be the only attachment in message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/UploadedInfo'
          required:
            - payload
    UploadType:
      type: string
      description: Type of file uploading
      enum:
        - image
        - video
        - audio
        - file
    ContactAttachmentRequest:
      type: object
      description: Request to attach contact card to message. MUST be the only attachment in message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/ContactAttachmentRequestPayload'
          required:
            - payload
    ContactAttachmentRequestPayload:
      type: object
      description: Payload for contact attachment request
      properties:
        name:
          description: Contact name
          nullable: true
          type: string
          readOnly: false
        contact_id:
          description: Contact identifier if it is registered Max user
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/UserId'
        vcf_info:
          description: Full information about contact in VCF format
          nullable: true
          readOnly: false
          type: string
        vcf_phone:
          description: Contact phone in VCF format
          readOnly: false
          nullable: true
          type: string
    StickerAttachmentRequest:
      type: object
      description: Request to attach sticker. MUST be the only attachment request in message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/StickerAttachmentRequestPayload'
          required:
            - payload
    StickerAttachmentRequestPayload:
      type: object
      description: Payload for sticker attachment request
      properties:
        code:
          description: Sticker code
          type: string
      required:
        - code
    InlineKeyboardAttachmentRequest:
      type: object
      description: Request to attach keyboard to message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/InlineKeyboardAttachmentRequestPayload'
          required:
            - payload
    InlineKeyboardAttachmentRequestPayload:
      type: object
      description: Payload for inline keyboard attachment request
      properties:
        buttons:
          description: Two-dimensional array of buttons
          type: array
          minItems: 1
          items:
            type: array
            items:
              $ref: '#/components/schemas/Button'
      required:
        - buttons
    LocationAttachmentRequest:
      type: object
      description: Request to attach geographic location to message
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
          required:
            - latitude
            - longitude
    ShareAttachmentRequest:
      type: object
      description: Request to attach media preview of any external URL
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
        - properties:
            payload:
              $ref: '#/components/schemas/ShareAttachmentPayload'
          required:
            - payload
    MarkupElement:
      type: object
      description: Base type for text markup (formatting) elements
      properties:
        type:
          description: Type of the markup element.
            Can be **strong**,
            *emphasized*, ~strikethrough~, ++underline++, `monospaced`, highlighted, link, quote, header or user_mention 
          type: string
        from:
          description: Element start index (zero-based) in text
          type: integer
          format: int32
        length:
          description: Length of the markup element
          type: integer
          format: int32
      discriminator:
        propertyName: type
        mapping:
          strong: '#/components/schemas/StrongMarkup'
          emphasized: '#/components/schemas/EmphasizedMarkup'
          monospaced: '#/components/schemas/MonospacedMarkup'
          link: '#/components/schemas/LinkMarkup'
          strikethrough: '#/components/schemas/StrikethroughMarkup'
          underline: '#/components/schemas/UnderlineMarkup'
          user_mention: '#/components/schemas/UserMentionMarkup'
          heading: '#/components/schemas/HeadingMarkup'
          highlighted: '#/components/schemas/HighlightedMarkup'
          quote: '#/components/schemas/QuoteMarkup'
      required:
        - type
        - from
        - length
    StrongMarkup:
      type: object
      description: Represents **bold** in text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    EmphasizedMarkup:
      type: object
      description: Represents *italic* in text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    MonospacedMarkup:
      type: object
      description: Represents `monospaced` or ```code``` block in text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    LinkMarkup:
      type: object
      description: Represents link in text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
        - properties:
            url:
              description: Link's URL
              type: string
              minLength: 1
              maxLength: 2048
          required:
            - url
    StrikethroughMarkup:
      type: object
      description: Represents ~strikethrough~ block in text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    UnderlineMarkup:
      type: object
      description: Represents ++underlined++ part of the text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    HeadingMarkup:
      type: object
      description: Represents header part of the text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    UserMentionMarkup:
      type: object
      description: Represents user mention in text. Mention can be both by user's username or ID if user doesn't have username
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
        - properties:
            user_link:
              description: '`@username` of mentioned user'
              type: string
              nullable: true
              readOnly: false
            user_id:
              description: Identifier of mentioned user without username
              allOf:
                - $ref: '#/components/schemas/UserId'
              nullable: true
              readOnly: false
    HighlightedMarkup:
      type: object
      description: Represents a highlighted piece of text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    QuoteMarkup:
      type: object
      description: Represents quote block in text
      allOf:
        - $ref: '#/components/schemas/MarkupElement'
    SubscriptionRequestBody:
      type: object
      description: Request to set up WebHook subscription
      properties:
        url:
          $ref: '#/components/schemas/SubscriptionUrl'
        secret:
          description: A secret to be sent in a header “X-Max-Bot-Api-Secret” in every webhook request, 5-256 characters. Only characters A-Z, a-z, 0-9, _ and - are allowed. The header is useful to ensure that the request comes from a webhook set by you.
          type: string
          pattern: '^[\w-]+$'
          minLength: 5
          maxLength: 256
          readOnly: false
        update_types:
          description: List of update types your bot want to receive. See `Update` object for a complete list of types
          example: '["message_created", "bot_started"]'
          type: array
          uniqueItems: true
          items:
            type: string
          readOnly: false
      required:
        - url
    GetSubscriptionsResult:
      type: object
      description: List of all WebHook subscriptions
      properties:
        subscriptions:
          description: Current subscriptions
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
      required:
        - subscriptions
    SimpleQueryResult:
      type: object
      description: Simple response to request
      properties:
        success:
          description: '`true` if request was successful. `false` otherwise'
          type: boolean
        message:
          description: Explanatory message if the result is not successful
          type: string
          readOnly: false
      required:
        - success
    PinMessageBody:
      type: object
      description: Request body for pinning a message in chat
      properties:
        message_id:
          description: Identifier of message to be pinned in chat
          allOf:
            - $ref: '#/components/schemas/MessageId'
        notify:
          description: If `true`, participants will be notified with system message in chat/channel
          type: boolean
          default: true
          readOnly: false
          nullable: true
      required:
        - message_id
    GetPinnedMessageResult:
      type: object
      description: Result of getting pinned message in chat
      properties:
        message:
          description: Pinned message. Can be `null` if no message pinned in chat
          readOnly: false
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Message'
    Callback:
      type: object
      description: Object sent to bot when user presses button
      properties:
        timestamp:
          description: Unix-time when user pressed the button
          type: integer
          format: int64
        callback_id:
          description: Current keyboard identifier
          type: string
        payload:
          description: Button payload
          type: string
          readOnly: false
        user:
          description: User pressed the button
          allOf:
            - $ref: '#/components/schemas/User'
      required:
        - timestamp
        - callback_id
        - user
    CallbackAnswer:
      type: object
      description: Send this object when your bot wants to react to when a button is pressed
      properties:
        message:
          description: Fill this if you want to modify current message
          nullable: true
          readOnly: false
          allOf:
            - $ref: '#/components/schemas/NewMessageBody'
        notification:
          description: Fill this if you just want to send one-time notification to user
          nullable: true
          readOnly: false
          type: string
    Error:
      type: object
      description: Server returns this if there was an exception to your request
      properties:
        error: 
          description: Error
          type: string
        code:
          description: Error code
          type: string
        message:
          description: Human-readable description
          type: string
      required:
        - code
        - message
    UploadEndpoint:
      description: Endpoint you should upload to your binaries
      type: object
      properties:
        url:
          description: URL to upload
          type: string
        token:
          description: Video or audio token for send message
          type: string
          readOnly: false
          nullable: true
      required:
        - url
    UserIdsList:
      type: object
      description: List of user identifiers
      properties:
        user_ids:
          items:
            $ref: '#/components/schemas/UserId'
          maxItems: 100
      required:
        - user_ids
    ActionRequestBody:
      type: object
      description: Request body for sending action to chat
      properties:
        action:
          $ref: '#/components/schemas/SenderAction'
      required:
        - action
    ChatAdminsList:
      type: object
      description: List of chat administrators with permissions
      properties:
        admins:
          type: array
          items:
            $ref: '#/components/schemas/ChatAdmin'
      required:
        - admins
    ChatAdmin:
      type: object
      description: Administrator id with permissions
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ChatAdminPermission'
        alias:
          description: Alias of the admin in chat. By default, `null`
          type: string
          readOnly: false
          nullable: true
      required:
        - user_id
        - permissions
    SenderAction:
      type: string
      description: Different actions to send to chat members
      enum:
        - typing_on
        - sending_photo
        - sending_video
        - sending_audio
        - sending_file
        - mark_seen
    UpdateList:
      type: object
      description: List of all updates in chats your bot participated in
      properties:
        updates:
          description: Page of updates
          type: array
          items:
            $ref: '#/components/schemas/Update'
        marker:
          description: Pointer to the next data page
          type: integer
          format: int64
          nullable: true
          readOnly: false
      required:
        - updates
    Update:
      type: object
      description: '`Update` object represents different types of events that happened in chat. See its inheritors'
      discriminator:
        propertyName: update_type
        mapping:
          message_created: '#/components/schemas/MessageCreatedUpdate'
          message_callback: '#/components/schemas/MessageCallbackUpdate'
          message_edited: '#/components/schemas/MessageEditedUpdate'
          message_removed: '#/components/schemas/MessageRemovedUpdate'
          comment_created: '#/components/schemas/CommentCreatedUpdate'
          comment_edited: '#/components/schemas/CommentEditedUpdate'
          comment_removed: '#/components/schemas/CommentRemovedUpdate'
          bot_added: '#/components/schemas/BotAddedToChatUpdate'
          bot_removed: '#/components/schemas/BotRemovedFromChatUpdate'
          user_added: '#/components/schemas/UserAddedToChatUpdate'
          user_removed: '#/components/schemas/UserRemovedFromChatUpdate'
          bot_started: '#/components/schemas/BotStartedUpdate'
          bot_stopped: '#/components/schemas/BotStoppedUpdate'
          dialog_cleared: '#/components/schemas/DialogClearedUpdate'
          dialog_removed: '#/components/schemas/DialogRemovedUpdate'
          dialog_muted: '#/components/schemas/DialogMutedUpdate'
          dialog_unmuted: '#/components/schemas/DialogUnmutedUpdate'
          chat_title_changed: '#/components/schemas/ChatTitleChangedUpdate'
          bot_admin_permissions_changed: '#/components/schemas/BotAdminPermissionsChangedUpdate'
      properties:
        update_type:
          type: string
        timestamp:
          description: Unix-time when event has occurred
          type: integer
          format: int64
      required:
        - update_type
        - timestamp
    MessageCallbackUpdate:
      type: object
      description: You will get this `update` as soon as user presses button
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            callback:
              description: ''
              allOf:
                - $ref: '#/components/schemas/Callback'
            message:
              description: Original message containing inline keyboard. Can be `null` in case it had been deleted by the moment a bot got this update
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Message'
              readOnly: false
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              nullable: true
              readOnly: false
          required:
            - callback
    MessageCreatedUpdate:
      type: object
      description: You will get this `update` as soon as message is created. In group chats bot receives this update only if it is administrator with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: Newly created message
              allOf:
                - $ref: '#/components/schemas/Message'
            user_locale:
              description: Current user locale in IETF BCP 47 format. Available only in dialogs
              type: string
              readOnly: false
              nullable: true
          required:
            - message
    MessageRemovedUpdate:
      type: object
      description: You will get this `update` as soon as message is removed. In group chats bot receives this update only if it is administrator with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message_id:
              description: Identifier of removed message
              allOf:
                - $ref: '#/components/schemas/MessageId'
            chat_id:
              description: Chat identifier where message has been deleted
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user_id:
              description: User who deleted this message
              allOf:
                - $ref: '#/components/schemas/UserId'
          required:
            - message_id
            - chat_id
            - user_id
    MessageEditedUpdate:
      type: object
      description: You will get this `update` as soon as message is edited. In group chats bot receives this update only if it is administrator with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: Edited message
              allOf:
                - $ref: '#/components/schemas/Message'
          required:
            - message
    CommentCreatedUpdate:
      type: object
      description: You will get this `update` as soon as comment is created. Bot receives this update only if it is administrator of the channel with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: Newly created comment
              allOf:
                - $ref: '#/components/schemas/Message'
          required:
            - message
    CommentRemovedUpdate:
      type: object
      description: You will get this `update` as soon as comment is removed. Bot receives this update only if it is administrator of the channel with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message_id:
              description: Identifier of removed comment
              allOf:
                - $ref: '#/components/schemas/MessageId'
            chat_id:
              description: Chat identifier where comment has been deleted
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user_id:
              description: User who deleted this comment
              allOf:
                - $ref: '#/components/schemas/UserId'
            post_id:
              description: Post identifier
              allOf:
                - $ref: '#/components/schemas/MessageId'
          required:
            - message_id
            - chat_id
            - user_id
            - post_id
    CommentEditedUpdate:
      type: object
      description: You will get this `update` as soon as comment is edited. Bot receives this update only if it is administrator of the channel with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            message:
              description: Edited comment
              allOf:
                - $ref: '#/components/schemas/Message'
          required:
            - message
    BotAddedToChatUpdate:
      type: object
      description: You will receive this update when bot has been added to chat
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Chat id where bot was added
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who added bot to chat
              allOf:
                - $ref: '#/components/schemas/User'
            is_channel:
              description: Indicates whether bot has been added to channel or not
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    BotRemovedFromChatUpdate:
      type: object
      description: You will receive this update when bot has been removed from chat
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Chat identifier bot removed from
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who removed bot from chat
              allOf:
                - $ref: '#/components/schemas/User'
            is_channel:
              description: Indicates whether bot has been removed from channel or not
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    UserAddedToChatUpdate:
      type: object
      description: You will receive this update when user has been added to chat where bot is administrator with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Chat identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User added to chat
              allOf:
                - $ref: '#/components/schemas/User'
            inviter_id:
              description: User who added user to chat. Can be `null` in case when user joined chat by link
              allOf:
                - $ref: '#/components/schemas/UserId'
              readOnly: false
              nullable: true
            is_channel:
              description: Indicates whether user has been added to channel or not
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    UserRemovedFromChatUpdate:
      type: object
      description: You will receive this update when user has been removed from chat where bot is administrator with `read_all_messages` permission
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Chat identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User removed from chat
              allOf:
                - $ref: '#/components/schemas/User'
            admin_id:
              description: Administrator who removed user from chat. Can be `null` in case when user left chat
              allOf:
                - $ref: '#/components/schemas/UserId'
              readOnly: false
            is_channel:
              description: Indicates whether user has been removed from channel or not
              type: boolean
          required:
            - chat_id
            - user
            - is_channel
    BotStartedUpdate:
      type: object
      description: Bot gets this type of update as soon as user pressed `Start` button
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Dialog identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User pressed the 'Start' button
              allOf:
                - $ref: '#/components/schemas/User'
            payload:
              description: Additional data from deep-link passed on bot startup
              type: string
              maxLength: 512
              nullable: true
              readOnly: false
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              readOnly: false
          required:
            - chat_id
            - user
    BotStoppedUpdate:
      type: object
      description: Bot gets this type of update as soon as bot has been stopped
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Dialog identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who stopped the bot
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              readOnly: false
          required:
            - chat_id
            - user
    DialogClearedUpdate:
      type: object
      description: Bot gets this type of update as soon as dialog history has been cleared
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Dialog identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who cleared the dialog
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              readOnly: false
          required:
            - chat_id
            - user
    DialogRemovedUpdate:
      type: object
      description: Bot gets this type of update as soon as dialog has been removed
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Dialog identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who removed the dialog
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              readOnly: false
          required:
            - chat_id
            - user
    DialogMutedUpdate:
      type: object
      description: Bot gets this type of update as soon as dialog has been muted
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Dialog identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who muted the dialog
              allOf:
                - $ref: '#/components/schemas/User'
            muted_until:
              description: Unix-time until which the dialog was muted
              type: integer
              format: int64
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              readOnly: false
          required:
            - chat_id
            - user
            - muted_until
    DialogUnmutedUpdate:
      type: object
      description: Bot gets this type of update as soon as dialog has been unmuted
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Dialog identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who unmuted the dialog
              allOf:
                - $ref: '#/components/schemas/User'
            user_locale:
              description: Current user locale in IETF BCP 47 format
              type: string
              readOnly: false
          required:
            - chat_id
            - user
    ChatTitleChangedUpdate:
      type: object
      description: Bot gets this type of update as soon as title has been changed in chat
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Chat identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user:
              description: User who changed title
              allOf:
                - $ref: '#/components/schemas/User'
            title:
              description: New title
              type: string
