            - title
    BotAdminPermissionsChangedUpdate:
      type: object
      description: Bot will get this update when bot admin permissions changed
      allOf:
        - $ref: '#/components/schemas/Update'
        - properties:
            chat_id:
              description: Chat identifier where event has occurred
              allOf:
                - $ref: '#/components/schemas/ChatId'
            user_id:
              description: User or bot who changed bot admin permissions
              allOf:
                - $ref: '#/components/schemas/UserId'
            bot_id:
              description: Bot that admin permissions changed
              allOf:
                - $ref: '#/components/schemas/UserId'
            is_channel:
              description: Indicates whether bot admin permissions has been changed in channel or not
              type: boolean
            is_admin:
              description: Indicates whether bot is admin in chat/channel or not
              type: boolean
            permissions:
              type: array
              uniqueItems: true
              nullable: true
              items:
                $ref: '#/components/schemas/ChatAdminPermission'
              readOnly: false
          required:
            - chat_id
            - user_id
            - bot_id
            - is_channel
            - is_admin
    ModifyMembersResult:
      type: object
      description: Result of members list modification request
      allOf:
        - $ref: '#/components/schemas/SimpleQueryResult'
        - properties:
            failed_user_ids:
              description: List of user IDs failed to add or delete
              type: array
              items:
                $ref: '#/components/schemas/UserId'
              nullable: true
              readOnly: false
              uniqueItems: true
            failed_user_details:
              type: array
              items:
                $ref: '#/components/schemas/FailedUserDetails'
              nullable: true
              readOnly: false
    FailedUserDetails:
      type: object
      description: Detailed info about why a user cannot be added to the chat.
      properties:
        error_code:
          description: Code add.participant.privacy - Privacy errors while add participants. Code add.participant.not.found - Users to add not found
          type: string
        user_ids:
          description: List of user IDs failed to add
          type: array
          items:
            $ref: '#/components/schemas/UserId'
          nullable: false
      required:
        - error_code
        - user_ids
