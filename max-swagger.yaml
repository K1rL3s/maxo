openapi: 3.0.0
info:
  version: 0.0.33
  title: Max Bot API
  license:
    name: Apache 2.0
  description: |-
    # About
    Bot API allows bots to interact with Max. Methods are called by sending HTTPS requests to [platform-api2.max.ru](https://platform-api2.max.ru) domain.
    Bots are third-party applications that use Max features. A bot can legitimately take part in a conversation. It can be achieved through HTTPS requests to the Max Bot API.

    ## Features
    Max bots of the current version are able to:
    - Communicate with users and respond to requests
    - Recommend users complete actions via programmed buttons
    - Request data from users (name, short reference, phone number)
    We'll keep working on expanding bot capabilities in the future.

    ## Examples
    Bots can be used for the following purposes:
    - Providing support, answering frequently asked questions
    - Sending typical information
    - Voting
    - Likes/dislikes
    - Following external links
    - Forwarding a user to a chat/channel

    ## HTTP verbs
    `GET` &mdash; getting resources, parameters are transmitted via URL

    `POST` &mdash; creation of resources (for example, sending new messages)

    `PUT` &mdash; editing resources

    `DELETE` &mdash; deleting resources

    `PATCH` &mdash; patching resources

    ## HTTP response codes
    `200` &mdash; successful operation

    `400` &mdash; invalid request

    `401` &mdash; authentication error

    `404` &mdash; resource not found

    `403` &mdash; forbidden

    `405` &mdash; method is not allowed

    `429` &mdash; the number of requests is exceeded

    `503` &mdash; service unavailable

    ## Resources format
    For content requests (PUT and POST) and responses, the API uses the JSON format.
    All strings are UTF-8 encoded.
    Date/time fields are represented as the number of milliseconds that have elapsed since 00:00 January 1, 1970 in the long format. To get it, you can simply multiply the UNIX timestamp by 1000. All date/time fields have a UTC timezone.
    ## Error responses
    In case of an error, the API returns a response with the corresponding HTTP code and JSON with the following fields:

    `code` - the string with the error key

    `message` - a string describing the error </br>

 
    ## Receiving notifications

    Max Bot API supports 2 options of receiving notifications on new events for bots:
    - Push notifications via WebHook (recommended). To receive data via WebHook, you'll have to [add subscription](https://dev.max.ru/docs-api/methods/POST/subscriptions);
    - Notifications upon request via long polling (/getUpdates) API (not recommended). All data can be received via long polling **by default** after creating the bot.      

      Receiving updates via Long Polling is limited in speed and event retention time — this method is not suitable for production environments. We recommend using Webhook at all stages of work.

    Both methods **cannot** be used simultaneously.
    Refer to the response schema of [/updates](https://dev.max.ru/docs-api/methods/GET/updates) method to check all available types of updates.

    ### Webhook
    There is some notes about how we handle webhook subscription:
    1. Sometimes webhook notification cannot be delivered in case when bot server or network is down.

      In such case we well retry delivery in exponentially increasing intervals and will do this until get
      `200 OK` status code from your server, but not longer than **8 hours** (*may change over time*) since update happened.

      We also consider any non `200`-response from server as failed delivery.


     ### Updates
    1. Minimum polling time - 300ms


    ## Message buttons
    You can program buttons for users answering a bot.
    Max supports the following types of buttons:

    `callback` &mdash; sends a notification with payload to a bot (via WebHook or long polling)
    
    `clipboard` &mdash; copies payload data to clipboard
    
    `open_app` &mdash; opens mini app

    `link` &mdash; makes a user to follow a link

    `message` &mdash; send a quick reply, command, or template message. 

    `request_contact` &mdash; requests the user permission to access contact information (phone number, short link, email)

    `request_geo_location` &mdash; asks user to provide current geo location

    To start create buttons (sendMessage) with `InlineKeyboardAttachment`:
    ```json
    {
      "text": "It is message with inline keyboard",
      "attachments": [
        {
          "type": "inline_keyboard",
          "payload": {
            "buttons": [
              [
                {
                  "type": "callback",
                  "text": "Press me!",
                  "payload": "button1 pressed"
                }
              ]
            ]
          }
        }
      ]
    }
    ```
    ## Deep linking
    Max supports deep linking mechanism for bots. It allows passing additional payload to the bot on startup.
    Deep link can contain any data encoded into string up to **128** characters long. Longer strings will be omitted and **not** passed to the bot.

    Each bot has start link that looks like:
    ```
    https://max.ru/<botName>?start=<payload>
    ```
    As soon as user clicks on such link we open dialog with bot and send this payload to bot as part of `bot_started` update:
    ```json
    {
        "update_type": "bot_started",
        "timestamp": 1573226679188,
        "chat_id": 1234567890,
        "user": {
            "user_id": 1234567890,
            "name": "Boris",
            "username": "borisd84"
        },
        "payload": "any data meaningful to bot"
    }
    ```

    Deep linking mechanism is supported for iOS version 2.7.0 and Android 2.9.0 and higher.
    
    ## Text formatting
    
    Message text can be improved with basic formatting such as: **strong**, *emphasis*, ~strikethough~, 
    <ins>underline</ins>, `code` or link. You can use either markdown-like or HTML formatting.
    
    To enable text formatting set the `format` property of NewMessageBody model.

    ### Max flavored Markdown
    To enable [Markdown](https://spec.commonmark.org/0.29/) parsing, set the `format` property of NewMessageBody model to `markdown`.
    
    We currently support only the following syntax:

    `*empasized*` or `_empasized_` for *italic* text
    
    `**strong**` or `__strong__` for __bold__ text
    
    `~~strikethough~~`  for ~strikethough~ text
    
    `++underline++`  for <ins>underlined</ins> text

    ``` `code` ``` or ` ```code``` ` for `monospaced` text

    `^^important^^` for highlighted text (colored in red, by default)
    
    `> quote` for 
    >quoted text

    `[Inline URL](https://dev.max.ru/)` for inline URLs

    `[User mention](max://user/%user_id%)` for user mentions without username
    
    `# Header` for header
    
    ### HTML support
    
    To enable HTML parsing, set the `format` property of NewMessageBody model to `html`.
    
    Only the following HTML tags are supported. All others will be stripped:
    
    Emphasized: `<i>` or `<em>`
    
    Strong: `<b>` or `<strong>`
    
    Strikethrough: `<del>` or `<s>`
    
    Underlined: `<ins>` or `<u>`
    
    Link: `<a href="https://dev.max.ru">Docs</a>`

    Monospaced text: `<pre>` or `<code>`

    Highlighted text: `<mark>`
    
    Quote: `<blockquote>`
    
    Header: `<h1>`

    Text formatting is supported for iOS since version 3.1 and Android since 2.20.0.

    # Libraries
    We have developed the official [Typescript client](https://github.com/max-messenger/max-bot-api-client-ts), [Go client](https://github.com/max-messenger/max-bot-api-client-go) and also [Go framework](https://github.com/max-messenger/maxbot/tree/main) 
servers:
  - url: '/'
security:
  - access_token: [ ]
tags:
  - name: bots
    description: Bot management
  - name: chats
    description: Chat and channel operations
  - name: messages
    description: Message sending and management
  - name: subscriptions
    description: Webhook subscriptions
  - name: upload
    description: File upload endpoints
  - name: user_model
    x-displayName: User
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/User"/>
  - name: user_with_photo_model
    x-displayName: User
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/UserWithPhoto"/>
  - name: bot_info
    x-displayName: BotInfo
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/BotInfo"/>
  - name: chat_model
    x-displayName: Chat
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/Chat"/>
  - name: chat_member
    x-displayName: ChatMember
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/ChatMember"/>
  - name: message_model
    x-displayName: Message
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/Message"/>
  - name: comment_message_model
    x-displayName: CommentMessage
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/CommentMessage"/>
  - name: new_message_model
    x-displayName: NewMessageBody
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/NewMessageBody"/>
  - name: new_comment_message_model
    x-displayName: NewCommentBody
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/NewCommentBody"/>
  - name: update_model
    x-displayName: Update
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/Update"/> 
x-tagGroups:
  - name: Methods
    tags:
      - bots
      - chats
      - comments
      - messages
      - subscriptions
      - upload
  - name: Objects
    tags:
      - user_model
      - user_with_photo_model
      - bot_info
      - chat_member
      - chat_model
      - message_model
      - new_message_model
      - new_comment_message_model
      - update_model
paths:
  /me:
    get:
      tags:
        - bots
      summary: Get current bot info
      operationId: getMyInfo
      description: Returns info about current bot. Current bot can be identified by access token. Method returns bot identifier, name and avatar (if any)
      responses:
        '200':
          description: Bot info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/commands:
    patch:
      tags:
        - bots
      summary: Edit current bot commands
      operationId: editMyCommands
      description: Edits current bot Commands.
      responses:
        '200':
          description: Modified bot commands info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        description: Bot commands to set
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCommandsPatch'
  /chats/{chatId}: 
    get:
      tags:
        - chats
      operationId: getChat
      description: Returns info about chat or channel.
      summary: Get chat
      parameters:
        - name: chatId
          description: Requested chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      responses:
        '200':
          description: Chat or channel information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch: 
      tags:
        - chats
      operationId: editChat
      description: 'Edits chat or channel info: title, icon, etc…'
      summary: Edit chat or channel info
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      requestBody:
        description: Chat or channel info to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPatch'
      responses:
        '200':
          description: If success, returns updated chat object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  '/chats/{chatId}/actions':
    post:
      tags:
        - chats
      operationId: sendAction
      description: Send bot action to chat.
      summary: Send action
      parameters:
        - name: chatId
          description: Chat identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      requestBody:
        description: Action to send to chat members
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  '/chats/{chatId}/pin':
    get:
      tags:
        - chats
      operationId: getPinnedMessage
      description: Get pinned message in chat or channel.
      summary: Get pinned message
      parameters:
        - name: chatId
          description: Chat identifier to get its pinned message
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      responses:
        '200':
          description: Pinned message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPinnedMessageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - chats
      operationId: pinMessage
      description: Pins message in chat or channel.
      summary: Pin message
      parameters:
        - name: chatId
          description: Chat identifier where message should be pinned
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      requestBody:
        description: Message to pin in chat
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinMessageBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - chats
      operationId: unpinMessage
      description: Unpins message in chat or channel.
      summary: Unpin message
      parameters:
        - name: chatId
          description: Chat identifier to remove pinned message
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  '/chats/{chatId}/members/me':
    get:
      tags:
        - chats
      operationId: getMembership
      summary: Get chat or channel membership
      description: Returns chat or channel  membership info for current bot 
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      responses:
        '200':
          description: Current bot membership info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete: 
      tags:
        - chats
      operationId: leaveChat
      summary: Leave chat
      description: Removes bot from chat or channel members.
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  '/chats/{chatId}/members/admins':
    get:
      tags:
        - chats
      operationId: getAdmins
      summary: Get chat or channel admins
      description: Returns all chat or channel administrators. Bot must be **administrator** in requested chat or channel. 
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      responses:
        '200':
          description: Administrators list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMembersList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post: 
      tags:
        - chats
      operationId: postAdmins
      summary: Set chat or channel admins
      description: Returns true if all administrators added. Additional permissions may require
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      requestBody:
        description: List of administrators to set in chat or channel
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatAdminsList'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  '/chats/{chatId}/members/admins/{userId}':
    delete: 
      tags:
        - chats
      operationId: deleteAdmins
      summary: Revoke admin rights
      description: Revokes admin rights from a user in the chat or channel by removing their administrative privileges. Additional permissions may require.
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
        - name: userId
          description: User identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/UserId'
            x-pattern: \d+
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  '/chats/{chatId}/members':
    get:
      tags:
        - chats
      operationId: getMembers
      summary: Get members
      description: Returns users participated in chat or channel. 
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
        - name: user_ids
          description: |-
            Comma-separated list of users identifiers to get their membership. When this parameter is passed, both `count` and `marker` are ignored
          required: false
          in: query
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/UserId'
            nullable: true
          style: form
        - name: marker
          description: Marker
          in: query
          schema:
            type: integer
            format: int64
        - name: count
          description: Count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Returns members list and pointer to the next data page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMembersList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - chats
      operationId: addMembers
      description: Adds members to chat. Additional permissions may require.
      summary: Add members
      parameters:
        - name: chatId
          description: Chat identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
      requestBody:
        description: List of users to add to chat
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdsList'
      responses:
        '200':
          description: Result of chat members modification request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyMembersResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - chats
      operationId: removeMember
      description: Removes member from chat or channel. Additional permissions may require. 
      summary: Remove member
      parameters:
        - name: chatId
          description: Chat or channel identifier
          required: true
          in: path
          schema:
            allOf:
              - $ref: '#/components/schemas/ChatId'
            x-pattern: \-?\d+
        - name: user_id
          description: User id to remove from chat or channel
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/UserId'
        - name: block
          description: |-
            Set to `true` if user should be blocked in chat.
            Applicable only for chats that have public or private link. Ignored otherwise
          required: false
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscriptions:
    get:
      tags:
        - subscriptions
      operationId: getSubscriptions
      description: In case your bot gets data via WebHook, the method returns list of all subscriptions
      summary: Get subscriptions
      responses:
        '200':
          description: As expected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - subscriptions
      operationId: subscribe
      description: |-
        Subscribes bot to receive updates via WebHook. After calling this method, the bot will receive notifications about new events in chat rooms at the specified URL.

        Your server **must** be listening on port **443**
      summary: Subscribe
      requestBody:
        description: WebHook subscription parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete: 
      tags:
        - subscriptions
      operationId: unsubscribe
      description: Unsubscribes bot from receiving updates via WebHook. After calling the method, the bot stops receiving notifications about new events. Notification via the long-poll API becomes available for the bot. Receiving updates via Long Polling is limited in speed and event retention time — this method is not suitable for production environments. We recommend using Webhook at all stages of work
      summary: Unsubscribe
      parameters:
        - name: url
          in: query
          description: URL to remove from WebHook subscriptions
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /uploads:
    post:
      tags:
        - upload
      operationId: getUploadUrl
      description: |-
        Returns the URL for the subsequent file upload.

        For example, you can upload it via curl:

        ```curl -i -X POST
          -H "Content-Type: multipart/form-data"
          -F "data=@movie.mp4" "%UPLOAD_URL%"```

        Two types of an upload are supported:
        - single request upload (multipart request)
        - and resumable upload.

        ##### Multipart upload
        This type of upload is a simpler one but it is less
        reliable and agile. If a `Content-Type`: multipart/form-data header is passed in a request our service indicates
        upload type as a simple single request upload.

        This type of an upload has some restrictions: 

        - image — available formats: JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC; maximum size for a single image: up to 50 MB AND no more than 7680 x 7680 px — both criteria must be met. For example, you cannot upload an image that is 55 MB and has dimensions of 7600 x 7600 px.
        - video — available formats: MP4, MOV, MKV, WEBM; maximum size for a single video: up to 250 MB
        - audio — available formats: MP3, WAV, M4A, and others, maximum size for a single audio file: up to 256 MB OR duration of no more than 60 minutes — both criteria must be met. For example, you cannot send an audio file that is 250 MB and 70 minutes long.
        - file — available formats: TXT, DOC, PDF, and other common formats, maximum size for a single file: up to 4 GB
        - type=photo parameter is no longer supported. If you used type=photo in previously created integrations, please replace it with type=image
        - Only one mediafile per request can be uploaded
        - No possibility to restart stopped / failed upload

        ##### Resumable upload
        If `Content-Type` header value is not equal to `multipart/form-data` our service indicated upload type
        as a resumable upload.
        With a `Content-Range` header current file chunk range and complete file size
        can be passed. If a network error has happened or upload was stopped you can continue to upload a file from
        the last successfully uploaded file chunk. You can request the last known byte of uploaded file from server
        and continue to upload a file.

        ##### Get upload status
        To GET an upload status you simply need to perform HTTPS-GET request to a file upload URL.
        Our service will respond with current upload status,
        complete file size and last known uploaded byte. This data can be used to complete stopped upload
        if something went wrong. If `REQUESTED_RANGE_NOT_SATISFIABLE` or `INTERNAL_SERVER_ERROR` status was returned
        it is a good point to try to restart an upload
      summary: Get upload URL
      parameters:
        - description: 'Uploaded file type: image, audio, video, file'
          name: type
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/UploadType'
      responses:
        '200':
          description: Returns URL to upload attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
